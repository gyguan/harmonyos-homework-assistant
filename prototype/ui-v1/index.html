select id="ps" onchange="setp('page',this.value)"></select></div><script>const S=[['today','今天'],['detail','作业详情'],['study','学习工作台'],['tutor','AI辅导'],['submit','提交']],P=[['dashboard','首页'],['import','导入'],['confirm','作业确认'],['progress','进度'],['submission','提交查看']],V={A:'A · Focus Journey',B:'B · Learning Desk',C:'C · Mission Board'};let q=new URLSearchParams(location.search),v=q.get('variant')||'A',r=q.get('role')||'student',d=q.get('device')||'phone',p=q.get('page')||(r==='student'?'today':'dashboard');function setp(k,x){let n=new URLSearchParams(location.search);n.set(k,x);if(k==='role')n.set('page',x==='student'?'today':'dashboard');location.search=n}function cy(x){let a=['A','B','C'],i=a.indexOf(v);setp('variant',a[(i+x+3)%3])}function nav(x){setp('page',x)}function task(s,t,st){return `<div class="task"><span class="tag">${s}</span><h4>${t}</h4><p>${st} · 教材关联 · 老师资料</p></div>`}function student(){return {today:`${task('语文','朗读《秋天的雨》','✓ 已完成')}${task('数学','练习册 P26 第1～6题','● 进行中')}${task('英语','Unit 3 听读','20:30前')}`,detail:`<div class="card"><span class="tag">数学</span><h2>练习册 P26 第1～6题</h2><p>先独立完成，再用红笔订正。完成后拍照上传。</p></div><div class="card" style="margin-top:10px"><b>老师资料</b><p>视频 03:24 · 语音 00:48 · PDF 2页</p></div><button class="btn" style="width:100%;margin-top:10px" onclick="nav('study')">开始作业</button>`,study:`<div class="card"><span class="tag">数学 · 进行中</span><h2>当前题目</h2><div class="source">小明有328张卡片，小华比小明少96张，两人一共有多少张？</div></div><div class="card" style="margin-top:10px"><b>AI 辅导</b><p>告诉我你卡在哪里，我先提示思路，不直接代做。</p><button class="btn alt" onclick="nav('tutor')">我有问题</button></div>`,tutor:`<div class="card"><b>AI Tutor</b><div class="bubble">题目先告诉了谁的数量？</div><div class="bubble me">小明有328张。</div><div class="bubble">很好。那先求小华的数量，要做加法还是减法？</div></div>`,submit:`<div class="source" style="text-align:center;padding-top:48px;font-size:18px">📷<br><b>拍照上传作业</b><p class="muted">连续拍摄 · 多页排序 · 清晰度检查</p></div><button class="btn" style="width:100%;margin-top:10px">提交并完成</butto div>`;return `<div class="C"><div class="chead"><h2>${r==='student'?'学习任务':'家庭进度'}</h2></div><div class="missions"><div>${z[p]||z[Object.keys(z)[0]]}</div><div class="coach"><b>${r==='student'?'小伴辅导':'需要关注'}</b><p>${r==='student'?'不会的题可以拍给我，我先提示思路。':'只把真正需要家长介入的事情放这里。'}</p></div></div><div class="dock">${navs()}</div></div>`}function render(){q=new URLSearchParams(location.search);v=(q.get('variant')||'A').toUpperCase();r=q.get('role')||'student';d=q.get('device')||'phone';p=q.get('page')||(r==='student'?'today':'dashboard');dev.className='dev '+d;vl.textContent=V[v];rs.value=r;ds.value=d;let pages=r==='student'?S:P;ps.innerHTML=pages.map(x=>`<option value="${x[0]}" ${p===x[0]?'selected':''}>${x[1]}</option>`).join('');app.innerHTML=v==='B'?B():v==='C'?C():A()}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cy(-1);if(e.key==='ArrowRight')cy(1)});render()</script></body></html>
