name: harmony-client-build

# Real ArkTS/HAP compilation requires Huawei Command Line Tools 26.0.0.
# Set the repository variable HARMONYOS_RUNNER_ENABLED=true only after a
# self-hosted/windows/x64/harmonyos-26 runner is online. Pull requests then
# compile automatically; workflow_dispatch remains available for manual checks.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'entry/**'
      - 'oh-package.json5'
      - 'build-profile.json5'
      - 'hvigor-config.json5'
      - 'scripts/verify_harmony_client.ps1'
  push:
    branches:
      - main
    paths:
      - 'entry/**'
      - 'oh-package.json5'
      - 'build-profile.json5'
      - 'hvigor-config.json5'
      - 'scripts/verify_harmony_client.ps1'

jobs:
  compile-harmony-client:
    name: Compile HarmonyOS client
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HARMONYOS_RUNNER_ENABLED == 'true' }}
    runs-on: [self-hosted, windows, x64, harmonyos-26]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile ArkTS and assemble debug HAP
        shell: powershell
        run: ./scripts/verify_harmony_client.ps1
