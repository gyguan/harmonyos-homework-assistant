name: static-gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
      - 'refactor/**'

jobs:
  validate-parent-import-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate homework inbox navigation
        run: |
          python scripts/validate_issue242_import_inbox.py
          python scripts/validate_parent_import_ui_conformance.py

  validate-parent-home-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate parent home and progress interaction
        run: |
          python scripts/validate_task_ui_consistency.py
          python scripts/validate_v2_slice4_parent_surfaces.py
          python scripts/validate_ui_refresh_copy.py

  validate-app-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate in-app identity switching
        run: |
          python scripts/validate_person_entry_role_lock.py
          python scripts/validate_harmony_ui_design.py

  validate-admin-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Web admin voice management
        run: |
          python scripts/validate_admin_login.py
          python scripts/validate_admin_voice_material_import.py
          node --check backend/src/main/resources/static/admin/js/login-shell.js
          node --check backend/src/main/resources/static/admin/js/api.js
          node --check backend/src/main/resources/static/admin/js/voice-material.js
          node --check backend/src/main/resources/static/admin/js/voice-management-view.js
          node --check backend/src/main/resources/static/admin/js/app.js

  validate-project-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate HarmonyOS project invariants
        run: python scripts/validate_harmony_project.py

      - name: Validate ArkTS compile safety
        run: python scripts/validate_arkts_compile_safety.py

      - name: Validate issue 241 capture spike
        run: python scripts/validate_issue241_capture_spike.py

      - name: Validate issue 242 import inbox
        run: python scripts/validate_issue242_import_inbox.py

      - name: Validate issue 243 share import
        run: python scripts/validate_issue243_share_import.py

      - name: Validate issue 244 guided capture
        run: python scripts/validate_issue244_guided_capture.py

      - name: Validate issue 245 chat reconstruction
        run: python scripts/validate_issue245_chat_reconstruction.py

      - name: Validate issue 246 homework understanding
        run: python scripts/validate_issue246_homework_understanding.py

      - name: Validate issue 247 source profile closure
        run: python scripts/validate_issue247_source_profile_closure.py

      - name: Validate issue 270 capture entry split
        run: python scripts/validate_issue270_capture_entry_split.py

      - name: Validate issue 271 capture home layout
        run: python scripts/validate_issue271_capture_home_layout.py

      - name: Validate parent import UI conformance
        run: python scripts/validate_parent_import_ui_conformance.py

      - name: Validate pasted teacher text import
        run: python scripts/validate_text_import_feature.py

      - name: Validate V0.2 parser and confirmation
        run: python scripts/validate_v02_parser_confirmation.py

      - name: Validate assignment editor consistency
        run: python scripts/validate_assignment_editor_consistency.py

      - name: Validate UI refresh and copy consistency
        run: python scripts/validate_ui_refresh_copy.py

      - name: Validate unified task UI consistency
        run: python scripts/validate_task_ui_consistency.py

      - name: Validate sustainable assignment foundation
        run: python scripts/validate_sustainable_assignment_foundation.py

      - name: Validate confirmation interaction
        run: python scripts/validate_confirmation_interaction.py

      - name: Validate parent delete and study media enhancements
        run: python scripts/validate_parent_delete_study_media.py

      - name: Validate real homework submission
        run: python scripts/validate_real_submission_feature.py

      - name: Validate multi-child isolation
        run: python scripts/validate_multi_child_isolation.py

      - name: Validate family cloud boundary
        run: python scripts/validate_family_cloud_store_boundary.py

      - name: Validate responsive navigation
        run: python scripts/validate_responsive_navigation.py

      - name: Validate V2 Phone/Pad baseline
        run: python scripts/validate_v2_phone_pad_baseline.py

      - name: Validate student home Today task list
        run: python scripts/validate_student_home_today_subjects.py

      - name: Validate issue 291 student UI simplification
        run: python scripts/validate_issue291_student_ui_simplification.py

      - name: Validate V2 Pad prototype alignment
        run: python scripts/validate_v2_pad_prototype_alignment.py

      - name: Validate person entry and locked roles
        run: python scripts/validate_person_entry_role_lock.py

      - name: Validate HarmonyOS UI design system
        run: python scripts/validate_harmony_ui_design.py

      - name: Validate V2 deep-page chrome
        run: python scripts/validate_v2_deep_page_chrome.py

      - name: Validate V2 clean-refactor rules
        run: python scripts/validate_v2_clean_refactor.py

      - name: Validate snapshot migration safety
        run: python scripts/validate_snapshot_migration.py

      - name: Validate voice assignment content type retention
        run: python scripts/validate_voice_assignment_content_type.py

      - name: Validate issue 298 voice material automation
        run: python scripts/validate_issue298_voice_material.py

      - name: Validate admin login refactor
        run: |
          python scripts/validate_admin_login.py
          node --check backend/src/main/resources/static/admin/js/login-shell.js
          node --check backend/src/main/resources/static/admin/js/app.js

      - name: Validate admin voice material import
        run: |
          python scripts/validate_admin_voice_material_import.py
          node --check backend/src/main/resources/static/admin/js/api.js
          node --check backend/src/main/resources/static/admin/js/voice-material.js
          node --check backend/src/main/resources/static/admin/js/voice-management-view.js
          node --check backend/src/main/resources/static/admin/js/app.js

      - name: Validate voice workspace media focus
        run: python scripts/validate_voice_workspace_media_focus.py

      - name: Validate voice workspace fullscreen
        run: python scripts/validate_voice_workspace_fullscreen.py

      - name: Validate V2 Slice 1 architecture
        run: python scripts/validate_v2_slice1.py

      - name: Validate V2 Slice 3 execution commands
        run: python scripts/validate_v2_slice3_execution.py

      - name: Validate V2 Assignment Detail content
        run: python scripts/validate_v2_assignment_detail_content.py

      - name: Validate V2 Slice 4 parent review authority
        run: python scripts/validate_v2_slice4_parent_review.py

      - name: Validate V2 Slice 4 parent surfaces
        run: python scripts/validate_v2_slice4_parent_surfaces.py

      - name: Validate V2 Slice 5 atomic batch publish
        run: python scripts/validate_v2_slice5_batch_publish.py

      - name: Validate V2 Slice 6 extracurricular create
        run: python scripts/validate_v2_slice6_extra_assignment.py

      - name: Validate V2 Slice 6 calendar
        run: python scripts/validate_v2_slice6_calendar.py

      - name: Validate V2 Slice 6 Pad calendar composition
        run: python scripts/validate_v2_slice6_pad_calendar.py

      - name: Validate backend V0.1 boundaries
        run: python scripts/validate_backend_v01.py

      - name: Validate backend V0.2 cloud and Tutor
        run: python scripts/validate_backend_v02.py

      - name: Validate backend real E2E smoke harness
        run: python scripts/validate_backend_e2e_smoke.py

      - name: Validate assignment countdown
        run: python scripts/validate_assignment_countdown.py

      - name: Validate student task selection
        run: python scripts/validate_student_task_selection.py

      - name: Validate single task timer
        run: python scripts/validate_single_task_timer.py

      - name: Validate parent review compatibility
        run: python scripts/validate_parent_review.py

      - name: Validate student assignments navigation
        run: python scripts/validate_student_assignments_navigation.py

      - name: Validate student profile navigation
        run: python scripts/validate_student_profile_navigation.py

      - name: Validate Practice Slice 1
        run: python scripts/validate_practice_slice1.py

      - name: Validate Practice Slice 2
        run: python scripts/validate_practice_slice2.py

      - name: Validate Practice Slice 3
        run: python scripts/validate_practice_slice3.py

      - name: Validate Practice Slice 4
        run: python scripts/validate_practice_slice4.py

      - name: Validate Practice content catalog
        run: python scripts/validate_practice_content.py

      - name: Validate Practice pass filter
        run: python scripts/validate_practice_pass_filter.py

      - name: Validate parent Tutor settings
        run: python scripts/validate_parent_tutor_settings.py

      - name: Validate AI suggested homework duration
        run: python scripts/validate_ai_expected_minutes.py

      - name: Validate Tutor question capture
        run: python scripts/validate_tutor_question_capture.py

      - name: Validate cloud submission photos
        run: python scripts/validate_cloud_submission_photos.py

      - name: Validate persisted assignment sync metadata
        run: python scripts/validate_assignment_sync_metadata.py

      - name: Validate API efficiency P0 invariants
        run: python scripts/validate_api_efficiency_p0.py

      - name: Validate API efficiency P1 invariants
        run: python scripts/validate_api_efficiency_p1.py

      - name: Validate API observability invariants
        run: python scripts/validate_api_observability.py

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and test backend
        run: mvn -f backend/pom.xml test

  backend-real-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homework
          POSTGRES_USER: homework
          POSTGRES_PASSWORD: homework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homework -d homework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package backend
        run: mvn -f backend/pom.xml -DskipTests package

      - name: Start backend against real PostgreSQL
        run: |
          nohup java -jar backend/target/homework-backend-0.1.0.jar > backend-e2e-first.log 2>&1 &
          echo $! > backend-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-e2e-first.log
          exit 1

      - name: Verify admin import page is served
        run: |
          curl -fsSL http://localhost:8080/admin | grep -q 'id="nav-voice-tasks"'
          curl -fsSL http://localhost:8080/admin | grep -q 'id="task-search-form"'
          curl -fsSL http://localhost:8080/admin | grep -q 'id="folder-search-form"'
          curl -fsSL http://localhost:8080/admin | grep -q 'id="import-result-body"'
          curl -fsS http://localhost:8080/admin/js/app.js | grep -q "uploadImport"

      - name: Run real backend E2E smoke with Tutor fallback
        run: python backend/scripts/e2e_smoke.py --expect-tutor-unavailable

      - name: Run assignment action command E2E
        run: python backend/scripts/assignment_action_e2e.py

      - name: Run Practice attempt E2E
        run: python backend/scripts/practice_e2e.py

      - name: Run parent review command E2E
        run: python backend/scripts/parent_review_e2e.py

      - name: Run batch publish E2E
        run: python backend/scripts/batch_publish_e2e.py

      - name: Run voice material daily automation E2E
        run: python backend/scripts/voice_material_e2e.py

      - name: Run API efficiency P1 E2E
        run: python backend/scripts/api_efficiency_p1_e2e.py

      - name: Run API observability E2E
        run: |
          python backend/scripts/api_observability_e2e.py
          grep -q "\[HTTP-DUPLICATE\].*scene=e2e.duplicate" backend-e2e-first.log
          grep -q "\[HTTP-REQUEST-BODY\].*body={" backend-e2e-first.log
          grep -q "\[HTTP-RESPONSE\].*body={" backend-e2e-first.log
          grep -q '"password":"\*\*\*"' backend-e2e-first.log
          if grep -q '"password":"parent123"' backend-e2e-first.log; then exit 1; fi

      - name: Restart backend while keeping PostgreSQL
        run: |
          kill "$(cat backend-e2e.pid)" || true
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat backend-e2e.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          nohup java -jar backend/target/homework-backend-0.1.0.jar > backend-e2e-restart.log 2>&1 &
          echo $! > backend-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-e2e-restart.log
          exit 1

      - name: Verify persisted auth session after backend restart
        run: python backend/scripts/e2e_smoke.py --session-only

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo '--- first startup ---'
          cat backend-e2e-first.log 2>/dev/null || true
          echo '--- restart ---'
          cat backend-e2e-restart.log 2>/dev/null || true

      - name: Stop backend
        if: always()
        run: kill "$(cat backend-e2e.pid)" 2>/dev/null || true
