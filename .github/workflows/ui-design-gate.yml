name: ui-design-gate

on:
  pull_request:
    paths:
      - 'entry/src/main/ets/**'
      - 'docs/product/**'
      - 'scripts/validate_harmony_ui_design.py'
      - '.github/workflows/ui-design-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'entry/src/main/ets/**'
      - 'docs/product/**'
      - 'scripts/validate_harmony_ui_design.py'
      - '.github/workflows/ui-design-gate.yml'

jobs:
  validate-ui-design:
    name: Validate UI design contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate typography and UI contracts
        run: python scripts/validate_harmony_ui_design.py
