# Copy this file to application-local.yml in the same directory.
# application-local.yml is ignored by Git and is automatically imported by application.yml.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/homework
    username: homework
    password: homework

app:
  bootstrap:
    # Local development only. Production should keep bootstrap disabled and provision accounts explicitly.
    enabled: true
    login-name: parent
    password: change-me-local-only

  http:
    # Keep business request/response bodies out of logs by default. Enable temporarily only when troubleshooting.
    # Credential-like fields are redacted, but homework/child/Tutor content is still sensitive business data.
    log-payloads: false
    max-payload-chars: 20000

  ai:
    # OpenAI-compatible transport. Most hosted/private model gateways can expose one of these protocols.
    # Supported values: responses | chat-completions
    protocol: responses

    # API key may be blank only when the target gateway does not require authentication.
    api-key: sk-your-key
    allow-unauthenticated: false

    # Examples:
    # OpenAI: https://api.openai.com
    # Private gateway / local model: http://127.0.0.1:8000
    base-url: https://api.openai.com

    # Paths are configurable because compatible providers do not always use exactly the same prefix.
    responses-path: /v1/responses
    chat-completions-path: /v1/chat/completions

    # Tutor and homework organizer may use different models on the same provider.
    # 必须填当前 provider 真实存在的模型名：没有通用默认值，留空会禁用全部 AI 链路并打启动 WARN。
    # 换成兼容厂商（如智谱）时同步改 base-url 与这里的模型名（例如 glm-5.2）。
    tutor-model: gpt-4o-mini
    organizer-model: gpt-4o-mini
    # Must support image input. Blank reuses organizer-model; same provider/base URL/key.
    image-organizer-model: ''

    # Set false if the provider does not support json_schema structured output.
    # The organizer will still ask for JSON and validate the returned structure locally.
    structured-output: true

    # Local troubleshooting only. When enabled, request/response payloads sent to the AI provider
    # are logged after secret redaction and length limiting. Do not enable in production.
    log-payloads: false
