<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小伴管理台</title>
  <link rel="stylesheet" href="/admin/css/admin.css?v=20260923-2">
</head>
<body>
  <div id="login-view" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">小伴</div>
      <h1>小伴管理台</h1>
      <p class="muted">家庭作业助手 · 管理入口</p>
      <form id="login-form" class="stack">
        <label>账号<input id="login-name" autocomplete="username" required></label>
        <label>密码<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">登录</button>
        <p id="login-error" class="error-text" hidden></p>
      </form>
    </section>
  </div>

  <div id="admin-view" class="admin-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">小伴</div>
        <div><strong>小伴管理台</strong><span>家庭管理</span></div>
      </div>
      <nav aria-label="管理台导航">
        <button id="nav-voice-tasks" class="nav-item active" type="button" aria-current="page">
          <span>语音任务</span><em>管理</em>
        </button>
        <button class="nav-item placeholder" type="button" disabled><span>首页</span><em>待扩展</em></button>
        <button class="nav-item placeholder" type="button" disabled><span>作业管理</span><em>待扩展</em></button>
        <button class="nav-item placeholder" type="button" disabled><span>系统</span><em>待扩展</em></button>
      </nav>
      <div class="sidebar-footer">
        <span id="account-name">家长</span>
        <button id="logout-button" class="text-button">退出</button>
      </div>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>语音任务</h1>
          <p>查看语音任务与来源文件夹，并从已上传素材直接创建任务。</p>
        </div>
      </header>

      <section class="card voice-task-card">
        <div class="voice-task-toolbar">
          <div class="voice-task-heading">
            <h2>语音任务</h2>
            <p id="voice-task-summary">正在加载任务…</p>
          </div>
          <div class="voice-task-controls">
            <label class="voice-task-student">学生
              <select id="student-select"></select>
            </label>
            <button id="upload-material-entry" class="primary-button" type="button">上传新文件夹</button>
          </div>
        </div>

        <div class="voice-task-stats" aria-label="语音任务统计">
          <div class="voice-task-stat"><strong id="voice-stat-created">0</strong><span>已创建任务</span></div>
          <div class="voice-task-stat"><strong id="voice-stat-ready">0</strong><span>待创建</span></div>
          <div class="voice-task-stat"><strong id="voice-stat-folders">0</strong><span>素材文件夹</span></div>
        </div>

        <div id="voice-task-list" class="voice-task-list"></div>
      </section>

      <section class="card config-card">
        <div class="section-title-row">
          <div><h2>导入设置</h2><p>这些设置会作为新识别目录的默认值。</p></div>
        </div>
        <div class="form-grid upload-default-grid">
          <label>预计用时
            <div class="inline-input"><input id="default-minutes" type="number" min="1" max="240" value="15"><span>分钟</span></div>
          </label>
        </div>
        <div class="subject-field">
          <span>科目</span>
          <div id="subject-chips" class="chips">
            <button type="button" class="chip active" data-subject="CHINESE">语文</button>
            <button type="button" class="chip" data-subject="MATH">数学</button>
            <button type="button" class="chip" data-subject="ENGLISH">英语</button>
            <button type="button" class="chip" data-subject="OTHER">其他</button>
          </div>
        </div>
        <button id="apply-defaults" class="secondary-button" type="button" disabled>应用默认设置到已识别目录</button>
      </section>

      <section id="upload-section" class="card picker-card">
        <input id="folder-input" type="file" webkitdirectory multiple hidden>
        <input id="folder-files-input" type="file" webkitdirectory multiple hidden>
        <button id="folder-picker" class="drop-zone" type="button">
          <span class="folder-icon">＋</span>
          <strong>选择文件夹</strong>
          <span>支持选择根目录，也支持将多个文件夹一次拖入这里</span>
          <small>支持 mp3 / m4a / wav / jpg / jpeg / png / webp / heic · 可继续添加多个文件夹</small>
        </button>
      </section>

      <section id="preview-card" class="card" hidden>
        <div class="section-title-row">
          <div><h2>待导入目录</h2><p id="preview-summary"></p></div>
          <button id="clear-packages" class="text-button danger" type="button">清空</button>
        </div>
        <div id="package-list" class="package-list"></div>
        <div class="action-bar">
          <div>
            <strong id="selected-summary">0 个可导入</strong>
            <span id="ignored-summary" class="muted"></span>
          </div>
          <button id="upload-button" class="primary-button" type="button" disabled>开始导入</button>
        </div>
      </section>

      <section id="imported-card" class="card" hidden>
        <div class="section-title-row"><div><h2>已导入文件</h2><p id="imported-summary">查看已经保存到素材库的目录和文件。</p></div><button id="refresh-imported" class="secondary-button" type="button">刷新</button></div>
        <div id="imported-list" class="imported-list"></div>
      </section>

      <section id="progress-card" class="card" hidden>
        <div class="section-title-row">
          <div><h2>导入进度</h2><p id="progress-text">准备上传…</p></div>
          <strong id="progress-percent">0%</strong>
        </div>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="result-message" class="result-message" hidden></div>
      </section>
    </main>
  </div>

  <script type="module" src="/admin/js/login-shell.js?v=20260923-2"></script>
  <script type="module" src="/admin/js/app.js?v=20260923-2"></script>
  <div id="asset-viewer" class="asset-viewer" hidden><div class="asset-viewer-backdrop" data-close-viewer></div><section class="asset-viewer-dialog" role="dialog" aria-modal="true" aria-label="素材预览"><button id="close-asset-viewer" class="asset-viewer-close" type="button" aria-label="关闭">×</button><div id="asset-viewer-content"></div></section></div>
</body>
</html>
