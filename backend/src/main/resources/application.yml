server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homework}
    username: ${DB_USERNAME:homework}
    password: ${DB_PASSWORD:homework}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 72MB

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    login-name: ${BOOTSTRAP_LOGIN:parent}
    password: ${BOOTSTRAP_PASSWORD:parent123}
    family-name: ${BOOTSTRAP_FAMILY_NAME:我的家庭}
  auth:
    token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:168}
  storage:
    root: ${APP_STORAGE_ROOT:./data/uploads}
  ai:
    protocol: ${AI_PROTOCOL:responses}
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
    responses-path: ${AI_RESPONSES_PATH:/v1/responses}
    chat-completions-path: ${AI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
    tutor-model: ${AI_TUTOR_MODEL:${OPENAI_MODEL:gpt-5.6-luna}}
    organizer-model: ${AI_ORGANIZER_MODEL:${OPENAI_ORGANIZER_MODEL:gpt-5.6-luna}}
    allow-unauthenticated: ${AI_ALLOW_UNAUTHENTICATED:false}
    structured-output: ${AI_STRUCTURED_OUTPUT:true}
