server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId} scene=%X{scene}] %logger{36} - %msg%n"

spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homework}
    username: ${DB_USERNAME:homework}
    password: ${DB_PASSWORD:homework}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # 单文件最大 50MB（视频上限已收紧到 50MB）；整请求放宽以容纳语音作业多文件。
      max-file-size: 60MB
      max-request-size: 70MB

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    login-name: ${BOOTSTRAP_LOGIN:}
    password: ${BOOTSTRAP_PASSWORD:}
    family-name: ${BOOTSTRAP_FAMILY_NAME:我的家庭}
  auth:
    token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:168}
  storage:
    root: ${APP_STORAGE_ROOT:./data/uploads}
  http:
    log-payloads: ${HTTP_LOG_PAYLOADS:false}
    max-payload-chars: ${HTTP_MAX_PAYLOAD_CHARS:20000}
  media-sync:
    worker-delay-ms: ${MEDIA_SYNC_WORKER_DELAY_MS:5000}
  ai:
    provider: ${AI_PROVIDER:AUTO}
    protocol: ${AI_PROTOCOL:responses}
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
    responses-path: ${AI_RESPONSES_PATH:/v1/responses}
    chat-completions-path: ${AI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
    tutor-model: ${AI_TUTOR_MODEL:${OPENAI_MODEL:gpt-5.6-luna}}
    organizer-model: ${AI_ORGANIZER_MODEL:${OPENAI_ORGANIZER_MODEL:}}
    image-organizer-model: ${AI_IMAGE_ORGANIZER_MODEL:}
    practice-model: ${AI_PRACTICE_MODEL:${OPENAI_PRACTICE_MODEL:}}
    media-sync-transcription-model: ${AI_AUDIO_TRANSCRIPTION_MODEL:${AI_MEDIA_SYNC_TRANSCRIPTION_MODEL:}}
    media-sync-transcriptions-path: ${AI_MEDIA_SYNC_TRANSCRIPTIONS_PATH:/v1/audio/transcriptions}
    media-sync-image-model: ${AI_MEDIA_SYNC_IMAGE_MODEL:}
    media-sync-alignment-model: ${AI_MEDIA_SYNC_ALIGNMENT_MODEL:}
    media-sync-max-ai-images: ${AI_MEDIA_SYNC_MAX_AI_IMAGES:12}
    allow-unauthenticated: ${AI_ALLOW_UNAUTHENTICATED:false}
    structured-output: ${AI_STRUCTURED_OUTPUT:true}
    log-payloads: ${AI_LOG_PAYLOADS:false}
    disable-thinking: ${AI_DISABLE_THINKING:true}
    homework-shorthand: ${AI_HOMEWORK_SHORTHAND:}
