name: homework-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homework
      POSTGRES_USER: ${DB_USERNAME:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d homework"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 默认不把 5432 暴露到宿主机。需要在本机做备份/维护时再取消注释：
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/homework
      DB_USERNAME: ${DB_USERNAME:?set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      BOOTSTRAP_LOGIN: ${BOOTSTRAP_LOGIN:-parent}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set in .env}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-168}
      APP_STORAGE_ROOT: /data/uploads
      # 生产环境关闭业务报文日志
      HTTP_LOG_PAYLOADS: "false"
      # AI 能力（可选；不配则 Tutor 降级，作业主流程不受影响）
      # 注意：国内厂商（智谱/百炼/硅基流动/火山/混元/千帆）都必须用 chat-completions 协议，
      # 默认的 responses 协议只有 OpenAI 支持，照默认值配国内地址会拿到 404 并静默降级。
      # 注意：这里的键必须与 application.yml 的 app.ai.* 一一对应，
      # 漏配的键不会报错，只会静默沿用镜像默认值（AI_IMAGE_ORGANIZER_MODEL 曾因此失效）。
      AI_PROTOCOL: ${AI_PROTOCOL:-responses}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_RESPONSES_PATH: ${AI_RESPONSES_PATH:-/v1/responses}
      AI_CHAT_COMPLETIONS_PATH: ${AI_CHAT_COMPLETIONS_PATH:-/v1/chat/completions}
      AI_TUTOR_MODEL: ${AI_TUTOR_MODEL:-}
      AI_ORGANIZER_MODEL: ${AI_ORGANIZER_MODEL:-}
      # 图片/截图识别必须指向视觉模型（如 glm-4.6v-flashx）。
      # 留空会回退到 AI_ORGANIZER_MODEL，若它是纯文本模型（如 glm-4-flash），
      # 接口调用前会被能力判定拦下，截图识别不可用。
      AI_IMAGE_ORGANIZER_MODEL: ${AI_IMAGE_ORGANIZER_MODEL:-}
      AI_PRACTICE_MODEL: ${AI_PRACTICE_MODEL:-}
      AI_ALLOW_UNAUTHENTICATED: ${AI_ALLOW_UNAUTHENTICATED:-false}
      AI_STRUCTURED_OUTPUT: ${AI_STRUCTURED_OUTPUT:-true}
      AI_LOG_PAYLOADS: ${AI_LOG_PAYLOADS:-false}
      AI_DISABLE_THINKING: ${AI_DISABLE_THINKING:-true}
      # 老师布置作业的惯用简写（追加在代码内置词条之后，不会覆盖内置）。
      # 格式「科目|简写|含义」，多条用英文分号分隔，简写里的 * 表示后面跟数字。
      # 例：数学|口算|口算题卡;英语|周练|周末练习单
      AI_HOMEWORK_SHORTHAND: ${AI_HOMEWORK_SHORTHAND:-}
      # 作业媒体同步（照片/录音 → 任务）所用模型。
      # 音频转写没有回退目标，留空即整条转写链路静默跳过（AudioTranscriptionClient.available()=false）。
      AI_AUDIO_TRANSCRIPTION_MODEL: ${AI_AUDIO_TRANSCRIPTION_MODEL:-}
      # 上面这个键的别名，两者取其一即可（application.yml 里是 AI_AUDIO_TRANSCRIPTION_MODEL 优先）
      AI_MEDIA_SYNC_TRANSCRIPTION_MODEL: ${AI_MEDIA_SYNC_TRANSCRIPTION_MODEL:-}
      AI_MEDIA_SYNC_TRANSCRIPTIONS_PATH: ${AI_MEDIA_SYNC_TRANSCRIPTIONS_PATH:-/v1/audio/transcriptions}
      # 下面两个留空会分别回退到 AI_IMAGE_ORGANIZER_MODEL / AI_ORGANIZER_MODEL
      AI_MEDIA_SYNC_IMAGE_MODEL: ${AI_MEDIA_SYNC_IMAGE_MODEL:-}
      AI_MEDIA_SYNC_ALIGNMENT_MODEL: ${AI_MEDIA_SYNC_ALIGNMENT_MODEL:-}
      AI_MEDIA_SYNC_MAX_AI_IMAGES: ${AI_MEDIA_SYNC_MAX_AI_IMAGES:-12}
      MEDIA_SYNC_WORKER_DELAY_MS: ${MEDIA_SYNC_WORKER_DELAY_MS:-5000}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads

  # ---------- HTTPS 反向代理（Caddy 自动签发 Let's Encrypt 证书）----------
  # 需要：服务器 80/443 已放行 + 域名 A 记录指向本机（默认用 sslip.io 免费域名）
  # 不需要 HTTPS 时可整段删除，或 `docker compose -f docker-compose.prod.yml up -d` 时用 --scale 忽略
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-192-144-143-141.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
